<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Labo : les exercices et les outils de ma formation au vibe coding.">
<title>Les exercices du cours — Labo</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263e3c;background:#fffdf4;line-height:1.65}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(125deg,#fff4bd 0%,#fffdf4 45%,#d9f7ed 100%)}header,main,footer{max-width:1000px;margin:auto;padding:24px}
header{background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:1px solid #9dcfc3}
.brand{font-size:24px;font-weight:800}a{color:#006b63;text-underline-offset:4px}
header a,.tool-link{display:inline-flex;align-items:center;min-height:44px;font-weight:700}
main{padding-top:48px;padding-bottom:64px}h1,h2,h3{color:#006b63;line-height:1.2}
h1{font-size:clamp(32px,6vw,52px);margin:0 0 24px}h2{font-size:24px}h3{font-size:22px;margin-top:0}
.intro{font-size:20px;max-width:680px;color:#006b63}.greeting,.category{color:#ad3c26;font-weight:650}
.grid,.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{min-width:0;background:#fff;box-shadow:0 8px 24px rgba(0,107,99,.08);border:1px solid #9dcfc3;border-radius:12px;padding:24px}
.card p{margin-bottom:16px}.tools .card{display:flex;flex-direction:column;align-items:flex-start}
.tools .card p:not(.category){flex:1}.category{font-size:14px;margin:0 0 12px}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 20px;border-radius:8px;background:#006b63;color:#fff;font-weight:700;text-decoration:none}
.button:hover{background:#00534d}a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid #ad3c26;outline-offset:4px}
.skip{position:absolute;left:16px;top:-100px;background:white;padding:12px;z-index:10}.skip:focus{top:12px}
section+section{margin-top:40px}footer{border-top:1px solid #9dcfc3;font-size:14px}
@media(max-width:650px){.grid,.tools{grid-template-columns:1fr}header,main,footer{padding:20px}main{padding-top:32px}}
</style>
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>
<header><a class="brand" href="./index.html" aria-current="page">Labo</a><nav aria-label="Navigation principale"><a href="./index.html" aria-current="page">Accueil</a></nav></header>
<main id="contenu">
<p class="greeting">bonjour les scapiens et scapiennes</p>
<p class="intro">Bienvenue dans le bac à sable</p>
<section aria-labelledby="pages-cours">
<h2 id="pages-cours">Les pages du cours</h2>
<p>Les prochaines pages du cours seront ajoutées ici.</p>
</section>
</main>
<footer>Labo — Projet de formation</footer>
</body>
</html>
