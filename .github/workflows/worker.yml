name: Vérifier le Worker

on:
  push:
    paths:
      - 'outils.html'
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'outils.html'
      - 'worker/**'
      - '.github/workflows/worker.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
