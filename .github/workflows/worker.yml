name: Vérifier et déployer le Worker

on:
  push:
    paths:
      - 'outils.html'
      - 'public-catalogue.js'
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'outils.html'
      - 'public-catalogue.js'
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Tester les routes du Worker en local
        run: |
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 > worker-test.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            --max-time 5 http://127.0.0.1:8787/outils.html > /dev/null; then
            cat worker-test.log
            exit 1
          fi

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'http://127.0.0.1:8787';
          const page = await fetch(origin + '/outils.html');
          assert.equal(page.status, 200);
          assert.match(await page.text(), /data-worker="oui"/);

          const response = await fetch(origin + '/api/outils');
          assert.equal(response.status, 200);
          const catalogue = await response.json();
          assert.ok(catalogue.outils.length > 0);
          assert.equal(catalogue.canEdit, false);

          const invalid = await fetch(origin + '/api/outils?offset=-1');
          assert.equal(invalid.status, 400);

          const write = await fetch(origin + '/api/initialiser', {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json' },
            body: '{}'
          });
          assert.equal(write.status, 403);
          NODE

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: labo-outils-production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Déployer labo-outils
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Ajoutez le secret CLOUDFLARE_API_TOKEN dans GitHub.}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Ajoutez la variable CLOUDFLARE_ACCOUNT_ID dans GitHub.}"
          npm run deploy
